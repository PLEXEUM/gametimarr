<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gametimarr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .btn-primary { background: #6366f1; color: white; padding: 0.5rem 1.5rem; border-radius: 0.5rem; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { border: 1px solid #475569; color: #94a3b8; padding: 0.5rem 1.5rem; border-radius: 0.5rem; background: transparent; }
        .btn-outline:hover { border-color: #6366f1; color: #6366f1; }
        .badge-scheduled { background: #3b82f620; color: #60a5fa; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-completed { background: #10b98120; color: #10b981; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-postponed { background: #f59e0b20; color: #f59e0b; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-wanted { background: #1e293b; color: #94a3b8; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-requested { background: #f59e0b20; color: #f59e0b; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-downloaded { background: #10b98120; color: #10b981; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; border-radius: 0.5rem; padding: 0.5rem 0.75rem; }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        .settings-collapse { display: none; }
        .settings-collapse.open { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem 1rem; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #334155; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; }
        tr:hover td { background: #1e293b; }
        tr.hidden-game { display: none; }
        .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; border: 1px solid #334155; padding: 0.75rem 1.25rem; border-radius: 0.5rem; color: #f1f5f9; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem; color: #94a3b8; }
        .checkbox-label input { width: 1rem; height: 1rem; accent-color: #6366f1; }
    </style>
</head>
<body>

<div class="max-w-6xl mx-auto px-4 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">🏈 Gametimarr</h1>
            <p class="text-sm text-slate-400">Select games to auto-download</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500" id="schedule-info">Next search: loading...</span>
            <button onclick="document.getElementById('settings-section').classList.toggle('open')" class="text-sm text-slate-400 hover:text-white">⚙️</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card p-4 mb-4">
        <div class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Sport</label>
                <select id="sport-select" onchange="loadSchedule()" class="w-40">
                    <option value="NCAAF">NCAAF</option>
                    <option value="NFL">NFL</option>
                    <option value="MLB">MLB</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Year</label>
                <select id="year-select" onchange="loadSchedule()" class="w-28">
                    <!-- Populated by JavaScript -->
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Filter Team</label>
                <input id="team-filter" type="text" placeholder="Search..." class="w-48" oninput="filterGames()">
            </div>
            <div class="flex items-center">
                <label class="checkbox-label">
                    <input type="checkbox" id="hide-completed" onchange="filterGames()" checked>
                    Hide Completed
                </label>
            </div>
            <div class="flex gap-2">
                <button onclick="searchSelected()" class="btn-primary" id="search-btn">🔍 Search Selected</button>
                <button onclick="searchAllWanted()" class="btn-outline text-sm">Search All Wanted</button>
            </div>
        </div>
    </div>

    <!-- Schedule Table -->
    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox" id="select-all" onchange="toggleAll()" class="accent-indigo-500"></th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Home</th>
                        <th></th>
                        <th>Away</th>
                        <th>Status</th>
                        <th>User Status</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <tr><td colspan="8" class="text-center py-8 text-slate-400">Loading schedule...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="mt-4 text-sm text-slate-400"></div>

    <!-- Settings (Collapsible) -->
    <div id="settings-section" class="settings-collapse card mt-4 p-4">
        <h3 class="font-semibold mb-3">⚙️ Settings</h3>

        <!-- Prowlarr -->
        <div class="border-t border-slate-700 pt-3 mt-3">
            <h4 class="font-medium text-indigo-400 text-sm">🔎 Prowlarr</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">URL</label>
                    <input id="prowlarr-url" type="text" placeholder="http://localhost:9696" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">API Key</label>
                    <input id="prowlarr-key" type="password" placeholder="API key" class="w-full">
                </div>
            </div>
        </div>

        <!-- Jackett -->
        <div class="border-t border-slate-700 pt-3 mt-3">
            <h4 class="font-medium text-indigo-400 text-sm">🔎 Jackett (Alternative)</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">URL</label>
                    <input id="jackett-url" type="text" placeholder="http://localhost:9117" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">API Key</label>
                    <input id="jackett-key" type="password" placeholder="API key" class="w-full">
                </div>
            </div>
        </div>

        <!-- qBittorrent -->
        <div class="border-t border-slate-700 pt-3 mt-3">
            <h4 class="font-medium text-indigo-400 text-sm">⬇️ qBittorrent</h4>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-2">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Host</label>
                    <input id="qbit-host" type="text" placeholder="localhost" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Port</label>
                    <input id="qbit-port" type="text" placeholder="8080" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Username</label>
                    <input id="qbit-user" type="text" placeholder="admin" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Password</label>
                    <input id="qbit-pass" type="password" placeholder="Password" class="w-full">
                </div>
            </div>
            <div class="mt-2">
                <button onclick="testQbit()" class="btn-outline text-sm">Test Connection</button>
                <span id="qbit-test-status" class="text-sm text-slate-400 ml-2"></span>
            </div>
        </div>

        <!-- Sport Folders -->
        <div class="border-t border-slate-700 pt-3 mt-3">
            <h4 class="font-medium text-indigo-400 text-sm">📁 Sport Folders</h4>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-2">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">NCAAF</label>
                    <input id="folder-ncaaf" type="text" placeholder="/media/NCAAF" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">NFL</label>
                    <input id="folder-nfl" type="text" placeholder="/media/NFL" class="w-full">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">MLB</label>
                    <input id="folder-mlb" type="text" placeholder="/media/MLB" class="w-full">
                </div>
            </div>
        </div>

        <!-- Schedule -->
        <div class="border-t border-slate-700 pt-3 mt-3">
            <h4 class="font-medium text-indigo-400 text-sm">⏰ Search Schedule</h4>
            <div class="mt-2">
                <label class="text-xs text-slate-400 block mb-1">Cron Expression</label>
                <input id="search-schedule" type="text" value="0 */4 * * *" class="w-full">
                <p class="text-xs text-slate-500 mt-1">Examples: <span class="font-mono">0 */4 * * *</span> (every 4 hours), <span class="font-mono">0 2 * * *</span> (daily at 2 AM)</p>
            </div>
        </div>

        <!-- Save/Load Buttons -->
        <div class="border-t border-slate-700 pt-3 mt-3 flex flex-wrap gap-2">
            <button onclick="saveSettings()" class="btn-primary text-sm">💾 Save Settings</button>
            <button onclick="loadSettings()" class="btn-outline text-sm">📂 Load Settings</button>
            <button onclick="syncSport()" class="btn-outline text-sm">🔄 Sync Schedule</button>
            <span id="settings-status" class="text-sm text-slate-400 ml-2 self-center"></span>
        </div>
    </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ============ CURRENT YEAR ============
const currentYear = new Date().getFullYear();

// ============ POPULATE YEAR DROPDOWN ============
document.addEventListener('DOMContentLoaded', () => {
    const yearSelect = document.getElementById('year-select');
    yearSelect.innerHTML = '';
    for (let y = currentYear; y >= currentYear - 2; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
    }
    
    loadSchedule();
    loadSettings();
    loadStatus();
});

// ============ LOAD SCHEDULE ============
function loadSchedule() {
    const sport = document.getElementById('sport-select').value;
    const year = document.getElementById('year-select').value;
    fetch(`/api/schedule?sport=${sport}&year=${year}`)
        .then(r => r.json())
        .then(data => {
            currentGames = data;
            renderSchedule(data);
        })
        .catch(() => document.getElementById('schedule-body').innerHTML = '<tr><td colspan="8" class="text-center py-8 text-red-400">Failed to load schedule</td></tr>');
}

let currentGames = [];

function renderSchedule(games) {
    const filter = document.getElementById('team-filter').value.toLowerCase();
    const hideCompleted = document.getElementById('hide-completed').checked;
    
    const filtered = games.filter(g => {
        const matchTeam = !filter || g.home.toLowerCase().includes(filter) || g.away.toLowerCase().includes(filter);
        const matchCompleted = !hideCompleted || g.status !== 'Completed';
        return matchTeam && matchCompleted;
    });
    
    if (filtered.length === 0) {
        document.getElementById('schedule-body').innerHTML = '<tr><td colspan="8" class="text-center py-8 text-slate-400">No games found</td></tr>';
        return;
    }
    
    document.getElementById('schedule-body').innerHTML = filtered.map(g => `
        <tr>
            <td><input type="checkbox" class="game-cb" data-id="${g.id}" ${g.user_status === 'downloaded' ? 'disabled' : ''} ${g.user_status === 'requested' || g.user_status === 'downloaded' ? 'checked' : ''}></td>
            <td>${g.date}</td>
            <td>${g.time || '-'}</td>
            <td class="font-medium">${g.home}</td>
            <td class="text-slate-500 text-sm">vs</td>
            <td class="font-medium">${g.away}</td>
            <td>${statusBadge(g.status)}</td>
            <td>${userStatusBadge(g.user_status)}</td>
        </tr>
    `).join('');
}

function statusBadge(status) {
    const labels = { 'Scheduled': '📅 Scheduled', 'Completed': '✅ Completed', 'Postponed': '⏳ Postponed', 'Canceled': '❌ Canceled' };
    const classes = { 'Scheduled': 'badge-scheduled', 'Completed': 'badge-completed', 'Postponed': 'badge-postponed', 'Canceled': 'badge-postponed' };
    return `<span class="${classes[status] || 'badge-scheduled'}">${labels[status] || status}</span>`;
}

function userStatusBadge(status) {
    const labels = { wanted: '⬜ Wanted', requested: '⏳ Searching', downloaded: '✅ Downloaded' };
    const classes = { wanted: 'badge-wanted', requested: 'badge-requested', downloaded: 'badge-downloaded' };
    return `<span class="${classes[status] || 'badge-wanted'}">${labels[status] || 'Wanted'}</span>`;
}

function filterGames() { renderSchedule(currentGames); }
function toggleAll() {
    const checked = document.getElementById('select-all').checked;
    document.querySelectorAll('.game-cb:not(:disabled)').forEach(cb => cb.checked = checked);
}

// ============ SEARCH ============
async function searchSelected() {
    const ids = [...document.querySelectorAll('.game-cb:checked:not(:disabled)')].map(cb => parseInt(cb.dataset.id));
    if (ids.length === 0) { showToast('No games selected', 'warning'); return; }
    
    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Searching...';
    document.getElementById('status-bar').textContent = `Searching ${ids.length} games...`;
    
    try {
        const res = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ game_ids: ids })
        });
        const data = await res.json();
        showToast(data.message || `Searched ${ids.length} games`, data.success ? 'success' : 'error');
        loadSchedule();
        loadStatus();
    } catch(e) {
        showToast('Search failed', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Search Selected';
        document.getElementById('status-bar').textContent = '';
    }
}

function searchAllWanted() {
    document.querySelectorAll('.game-cb:not(:disabled)').forEach(cb => cb.checked = true);
    searchSelected();
}

// ============ STATUS ============
function loadStatus() {
    fetch('/api/status')
        .then(r => r.json())
        .then(data => {
            document.getElementById('schedule-info').textContent = 
                `Wanted: ${data.wanted || 0} | Requested: ${data.requested || 0} | Downloaded: ${data.downloaded || 0} | Next: ${data.next_run || 'never'}`;
        })
        .catch(() => {});
}

// ============ SETTINGS ============
function loadSettings() {
    fetch('/api/settings')
        .then(r => r.json())
        .then(data => {
            document.getElementById('prowlarr-url').value = data.prowlarr_url || '';
            document.getElementById('prowlarr-key').value = data.prowlarr_api_key || '';
            document.getElementById('jackett-url').value = data.jackett_url || '';
            document.getElementById('jackett-key').value = data.jackett_api_key || '';
            document.getElementById('qbit-host').value = data.qbit_host || 'localhost';
            document.getElementById('qbit-port').value = data.qbit_port || '8080';
            document.getElementById('qbit-user').value = data.qbit_username || 'admin';
            document.getElementById('qbit-pass').value = data.qbit_password || '';
            document.getElementById('search-schedule').value = data.search_schedule || '0 */4 * * *';
            
            let folders = {};
            try { folders = JSON.parse(data.sport_folders || '{}'); } catch(e) {}
            document.getElementById('folder-ncaaf').value = folders.NCAAF || '';
            document.getElementById('folder-nfl').value = folders.NFL || '';
            document.getElementById('folder-mlb').value = folders.MLB || '';
        })
        .catch(() => showToast('Failed to load settings', 'error'));
}

function saveSettings() {
    const folders = {
        NCAAF: document.getElementById('folder-ncaaf').value,
        NFL: document.getElementById('folder-nfl').value,
        MLB: document.getElementById('folder-mlb').value
    };
    
    const payload = {
        prowlarr_url: document.getElementById('prowlarr-url').value,
        prowlarr_api_key: document.getElementById('prowlarr-key').value,
        jackett_url: document.getElementById('jackett-url').value,
        jackett_api_key: document.getElementById('jackett-key').value,
        qbit_host: document.getElementById('qbit-host').value,
        qbit_port: document.getElementById('qbit-port').value,
        qbit_username: document.getElementById('qbit-user').value,
        qbit_password: document.getElementById('qbit-pass').value,
        search_schedule: document.getElementById('search-schedule').value,
        sport_folders: JSON.stringify(folders)
    };
    
    fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('settings-status').textContent = data.success ? '✅ Saved' : '❌ Failed';
        if (data.success) { showToast('Settings saved', 'success'); loadStatus(); }
        else showToast('Failed to save settings', 'error');
    })
    .catch(() => showToast('Error saving settings', 'error'));
}

async function testQbit() {
    const status = document.getElementById('qbit-test-status');
    status.textContent = '⏳ Testing...';
    try {
        const res = await fetch('/api/qbit/test', { method: 'POST' });
        const data = await res.json();
        status.textContent = data.success ? '✅ Connected' : '❌ ' + (data.message || 'Failed');
        if (data.success) showToast('qBittorrent connected', 'success');
        else showToast('qBittorrent connection failed', 'error');
    } catch(e) {
        status.textContent = '❌ Error';
        showToast('Test failed', 'error');
    }
}

async function syncSport() {
    const sport = document.getElementById('sport-select').value;
    const year = document.getElementById('year-select').value;
    const status = document.getElementById('settings-status');
    status.textContent = '⏳ Syncing...';
    
    try {
        const res = await fetch(`/api/sync/${sport}?year=${year}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
            status.textContent = `✅ Synced ${sport} ${year}`;
            showToast(`Synced ${sport} ${year}`, 'success');
            loadSchedule();
        } else {
            status.textContent = '❌ ' + (data.message || 'Sync failed');
            showToast('Sync failed', 'error');
        }
    } catch(e) {
        status.textContent = '❌ Error';
        showToast('Sync error', 'error');
    }
}

// ============ TOAST ============
function showToast(message, type = 'info') {
    const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#6366f1' };
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.borderLeft = `4px solid ${colors[type] || colors.info}`;
    toast.textContent = message;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gametimarr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
        .btn-primary { background: #6366f1; color: white; padding: 0.5rem 1.5rem; border-radius: 0.5rem; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-outline { border: 1px solid #475569; color: #94a3b8; padding: 0.5rem 1.5rem; border-radius: 0.5rem; background: transparent; }
        .btn-outline:hover { border-color: #6366f1; color: #6366f1; }
        .badge-wanted { background: #1e293b; color: #94a3b8; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-requested { background: #f59e0b20; color: #f59e0b; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-downloaded { background: #10b98120; color: #10b981; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        .badge-failed { background: #ef444420; color: #ef4444; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; }
        input, select { background: #0f172a; border: 1px solid #334155; color: #f1f5f9; border-radius: 0.5rem; padding: 0.5rem 0.75rem; }
        input:focus, select:focus { outline: none; border-color: #6366f1; }
        .settings-collapse { display: none; }
        .settings-collapse.open { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.75rem 1rem; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #334155; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #1e293b; }
        tr:hover td { background: #1e293b; }
        .status-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.5rem; }
        .status-dot.wanted { background: #475569; }
        .status-dot.requested { background: #f59e0b; animation: pulse 1.5s infinite; }
        .status-dot.downloaded { background: #10b981; }
        .status-dot.failed { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; border: 1px solid #334155; padding: 0.75rem 1.25rem; border-radius: 0.5rem; color: #f1f5f9; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="max-w-6xl mx-auto px-4 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-indigo-400">🏈 Gametimarr</h1>
            <p class="text-sm text-slate-400">Select games to auto-download</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs text-slate-500" id="schedule-info">Next search: loading...</span>
            <button onclick="document.getElementById('settings-section').classList.toggle('open')" class="text-sm text-slate-400 hover:text-white">⚙️</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card p-4 mb-4">
        <div class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Sport</label>
                <select id="sport-select" hx-get="/api/schedule" hx-target="#schedule-body" hx-trigger="change" class="w-40">
                    <option value="NCAAF">NCAAF</option>
                    <option value="NFL">NFL</option>
                    <option value="MLB">MLB</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Year</label>
                <select id="year-select" hx-get="/api/schedule" hx-target="#schedule-body" hx-trigger="change" class="w-28">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Filter Team</label>
                <input id="team-filter" type="text" placeholder="Search..." class="w-48" oninput="filterGames()">
            </div>
            <div class="flex gap-2">
                <button onclick="searchSelected()" class="btn-primary" id="search-btn">🔍 Search Selected</button>
                <button onclick="searchAllWanted()" class="btn-outline text-sm">Search All Wanted</button>
            </div>
        </div>
    </div>

    <!-- Schedule Table -->
    <div class="card overflow-hidden">
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px"><input type="checkbox" id="select-all" onchange="toggleAll()" class="accent-indigo-500"></th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Home</th>
                        <th></th>
                        <th>Away</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <tr><td colspan="7" class="text-center py-8 text-slate-400">Loading schedule...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="mt-4 text-sm text-slate-400"></div>

    <!-- Settings (Collapsible) -->
    <div id="settings-section" class="settings-collapse card mt-4 p-4">
        <h3 class="font-semibold mb-3">Settings</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
                <label class="text-xs text-slate-400">TheSportsDB API Key</label>
                <input id="tsdb-key" type="password" placeholder="Enter API key" class="w-full">
            </div>
            <div>
                <label class="text-xs text-slate-400">Prowlarr URL</label>
                <input id="prowlarr-url" type="text" placeholder="http://localhost:9696" class="w-full">
            </div>
            <div>
                <label class="text-xs text-slate-400">Prowlarr API Key</label>
                <input id="prowlarr-key" type="password" placeholder="API key" class="w-full">
            </div>
            <div>
                <label class="text-xs text-slate-400">qBittorrent</label>
                <div class="flex gap-2">
                    <input id="qbit-host" type="text" placeholder="localhost" class="w-1/3">
                    <input id="qbit-port" type="text" placeholder="8080" class="w-1/4">
                    <input id="qbit-user" type="text" placeholder="admin" class="w-1/3">
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-400">qBittorrent Password</label>
                <input id="qbit-pass" type="password" placeholder="Password" class="w-full">
            </div>
            <div>
                <label class="text-xs text-slate-400">Search Schedule (cron)</label>
                <input id="search-schedule" type="text" value="0 */4 * * *" class="w-full">
            </div>
        </div>
        <div class="mt-3 flex gap-2">
            <button onclick="saveSettings()" class="btn-primary text-sm">Save Settings</button>
            <button onclick="loadSettings()" class="btn-outline text-sm">Load Settings</button>
            <span id="settings-status" class="text-sm text-slate-400 ml-2 self-center"></span>
        </div>
        <div class="mt-3 text-xs text-slate-500 border-t border-slate-700 pt-3">
            Sport Folders (format: NCAAF=/path,NFL=/path,MLB=/path)
            <input id="sport-folders" type="text" placeholder='NCAAF="/media/NCAAF",NFL="/media/NFL",MLB="/media/MLB"' class="w-full mt-1">
        </div>
    </div>

</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
// ============ LOAD SCHEDULE ============
document.addEventListener('DOMContentLoaded', () => {
    loadSchedule();
    loadSettings();
    loadStatus();
});

function loadSchedule() {
    const sport = document.getElementById('sport-select').value;
    const year = document.getElementById('year-select').value;
    fetch(`/api/schedule?sport=${sport}&year=${year}`)
        .then(r => r.json())
        .then(data => renderSchedule(data))
        .catch(() => document.getElementById('schedule-body').innerHTML = '<tr><td colspan="7" class="text-center py-8 text-red-400">Failed to load schedule</td></tr>');
}

function renderSchedule(games) {
    const filter = document.getElementById('team-filter').value.toLowerCase();
    const filtered = games.filter(g => 
        !filter || g.home.toLowerCase().includes(filter) || g.away.toLowerCase().includes(filter)
    );
    
    if (filtered.length === 0) {
        document.getElementById('schedule-body').innerHTML = '<tr><td colspan="7" class="text-center py-8 text-slate-400">No games found</td></tr>';
        return;
    }
    
    document.getElementById('schedule-body').innerHTML = filtered.map(g => `
        <tr>
            <td><input type="checkbox" class="game-cb" data-id="${g.id}" ${g.status === 'downloaded' ? 'disabled' : ''} ${g.status === 'wanted' ? 'checked' : ''}></td>
            <td>${g.date}</td>
            <td>${g.time}</td>
            <td class="font-medium">${g.home}</td>
            <td class="text-slate-500 text-sm">vs</td>
            <td class="font-medium">${g.away}</td>
            <td>${statusBadge(g.status)}</td>
        </tr>
    `).join('');
}

function statusBadge(status) {
    const labels = { wanted: '⬜ Request', requested: '⏳ Searching', downloaded: '✅ Downloaded', failed: '❌ Failed' };
    const classes = { wanted: 'badge-wanted', requested: 'badge-requested', downloaded: 'badge-downloaded', failed: 'badge-failed' };
    return `<span class="${classes[status] || 'badge-wanted'}">${labels[status] || 'Request'}</span>`;
}

function filterGames() { loadSchedule(); }
function toggleAll() {
    const checked = document.getElementById('select-all').checked;
    document.querySelectorAll('.game-cb:not(:disabled)').forEach(cb => cb.checked = checked);
}

// ============ SEARCH ============
async function searchSelected() {
    const ids = [...document.querySelectorAll('.game-cb:checked:not(:disabled)')].map(cb => cb.dataset.id);
    if (ids.length === 0) { showToast('No games selected', 'warning'); return; }
    
    const btn = document.getElementById('search-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Searching...';
    document.getElementById('status-bar').textContent = `Searching ${ids.length} games...`;
    
    try {
        const res = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ game_ids: ids })
        });
        const data = await res.json();
        showToast(data.message || `Searched ${ids.length} games`, data.success ? 'success' : 'error');
        loadSchedule();
        loadStatus();
    } catch(e) {
        showToast('Search failed', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Search Selected';
        document.getElementById('status-bar').textContent = '';
    }
}

function searchAllWanted() {
    document.querySelectorAll('.game-cb:not(:disabled)').forEach(cb => cb.checked = true);
    searchSelected();
}

// ============ STATUS ============
function loadStatus() {
    fetch('/api/status')
        .then(r => r.json())
        .then(data => {
            document.getElementById('schedule-info').textContent = 
                `Wanted: ${data.wanted || 0} | Requested: ${data.requested || 0} | Downloaded: ${data.downloaded || 0}`;
        })
        .catch(() => {});
}

// ============ SETTINGS ============
function loadSettings() {
    fetch('/api/settings')
        .then(r => r.json())
        .then(data => {
            document.getElementById('tsdb-key').value = data.thesportsdb_api_key || '';
            document.getElementById('prowlarr-url').value = data.prowlarr_url || '';
            document.getElementById('prowlarr-key').value = data.prowlarr_api_key || '';
            document.getElementById('qbit-host').value = data.qbit_host || 'localhost';
            document.getElementById('qbit-port').value = data.qbit_port || '8080';
            document.getElementById('qbit-user').value = data.qbit_username || 'admin';
            document.getElementById('qbit-pass').value = data.qbit_password || '';
            document.getElementById('search-schedule').value = data.search_schedule || '0 */4 * * *';
            document.getElementById('sport-folders').value = data.sport_folders || 'NCAAF="/media/NCAAF",NFL="/media/NFL",MLB="/media/MLB"';
        })
        .catch(() => showToast('Failed to load settings', 'error'));
}

function saveSettings() {
    const payload = {
        thesportsdb_api_key: document.getElementById('tsdb-key').value,
        prowlarr_url: document.getElementById('prowlarr-url').value,
        prowlarr_api_key: document.getElementById('prowlarr-key').value,
        qbit_host: document.getElementById('qbit-host').value,
        qbit_port: document.getElementById('qbit-port').value,
        qbit_username: document.getElementById('qbit-user').value,
        qbit_password: document.getElementById('qbit-pass').value,
        search_schedule: document.getElementById('search-schedule').value,
        sport_folders: document.getElementById('sport-folders').value
    };
    
    fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('settings-status').textContent = data.success ? '✅ Saved' : '❌ Failed';
        if (data.success) showToast('Settings saved', 'success');
        else showToast('Failed to save settings', 'error');
    })
    .catch(() => showToast('Error saving settings', 'error'));
}

// ============ TOAST ============
function showToast(message, type = 'info') {
    const colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#6366f1' };
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.borderLeft = `4px solid ${colors[type] || colors.info}`;
    toast.textContent = message;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}
</script>

</body>
</html>

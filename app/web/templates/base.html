<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gametimarr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* Theme Variables */
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent: #6366f1;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.15);
        }

        [data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent: #6366f1;
            --success: #059669;
            --success-bg: rgba(5, 150, 105, 0.1);
            --warning: #d97706;
            --warning-bg: rgba(217, 119, 6, 0.1);
            --danger: #dc2626;
            --danger-bg: rgba(220, 38, 38, 0.1);
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .nav-link {
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-outline {
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .badge-downloaded {
            background: var(--success-bg);
            color: var(--success);
        }

        .badge-wanted {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .badge-requested {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            color: white;
            font-size: 0.875rem;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="card border-b border-t-0 border-x-0 px-4 py-3 md:px-6 md:py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 md:gap-8">
                <span class="text-lg md:text-xl font-bold text-indigo-400 whitespace-nowrap">🏈 Gametimarr</span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleTheme()" class="text-sm nav-link px-2 md:px-3 py-1 rounded border border-current">
                    <span class="hidden sm:inline">🌙 Theme</span>
                    <span class="sm:hidden">🌙</span>
                </button>
            </div>
        </div>

        <!-- Sub-navigation -->
        <div class="mt-3 pt-3 border-t flex gap-6 text-sm" style="border-color: var(--border-color);">
            <a href="/" class="nav-link font-medium">Schedule</a>
            <a href="/downloads" class="nav-link font-medium">Downloads</a>
            <a href="/settings" class="nav-link font-medium">Settings</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Toast notifications
        function showToast(message, type = 'success', duration = 4000) {
            const colors = {
                success: 'bg-green-800',
                error: 'bg-red-800',
                warning: 'bg-yellow-800',
                info: 'bg-blue-800'
            };
            const toast = document.createElement('div');
            toast.className = `toast ${colors[type] || colors.info}`;
            toast.textContent = message;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>

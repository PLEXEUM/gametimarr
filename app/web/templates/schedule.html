{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold">Sports Schedule</h1>
            <p class="text-sm mt-1" style="color: var(--text-secondary);">
                Select games you want to download
            </p>
        </div>
        <div class="flex gap-3">
            <button onclick="searchSelected()" 
                    class="px-4 py-2 rounded-lg text-sm font-medium text-white btn-primary">
                🔍 Search Selected
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card rounded-xl p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Sport Selector -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color: var(--text-secondary);">
                    Sport
                </label>
                <select id="sport-select" onchange="loadSchedule()" 
                        class="w-full px-3 py-2 rounded-lg text-sm border"
                        style="background: var(--bg-primary); border-color: var(--border-color); color: var(--text-primary);">
                    <option value="NCAAF">NCAA Football</option>
                    <option value="NFL">NFL</option>
                    <option value="MLB">MLB</option>
                </select>
            </div>

            <!-- Year Selector -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color: var(--text-secondary);">
                    Year
                </label>
                <select id="year-select" onchange="loadSchedule()" 
                        class="w-full px-3 py-2 rounded-lg text-sm border"
                        style="background: var(--bg-primary); border-color: var(--border-color); color: var(--text-primary);">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>
            </div>

            <!-- Team Filter -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wide mb-1" style="color: var(--text-secondary);">
                    Filter by Team
                </label>
                <input id="team-filter" type="text" placeholder="Search teams..." 
                       oninput="filterGames()"
                       class="w-full px-3 py-2 rounded-lg text-sm border"
                       style="background: var(--bg-primary); border-color: var(--border-color); color: var(--text-primary);">
            </div>
        </div>
    </div>

    <!-- Schedule Table -->
    <div class="card rounded-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr style="border-bottom: 1px solid var(--border-color);">
                        <th style="width: 40px; padding: 0.75rem 1rem;">
                            <input type="checkbox" id="select-all" onchange="toggleAllGames()" 
                                   class="accent-indigo-500">
                        </th>
                        <th class="text-left" style="padding: 0.75rem 1rem;">Date</th>
                        <th class="text-left" style="padding: 0.75rem 1rem;">Time</th>
                        <th class="text-left" style="padding: 0.75rem 1rem;">Game</th>
                        <th class="text-left" style="padding: 0.75rem 1rem;">Status</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Games will be loaded here by JavaScript -->
                    <tr>
                        <td colspan="5" class="text-center py-8" style="color: var(--text-secondary);">
                            Loading schedule...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Loading indicator for search -->
    <div id="search-status" class="hidden card rounded-xl p-4 text-center" style="color: var(--text-secondary);">
        <span id="search-status-text">Searching...</span>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    // Sample game data - this will be replaced with real data from TheSportsDB
    let games = [];
    let gameStatuses = {};

    // Load schedule when page loads
    window.addEventListener('DOMContentLoaded', () => {
        loadSchedule();
    });

    async function loadSchedule() {
        const sport = document.getElementById('sport-select').value;
        const year = document.getElementById('year-select').value;
        
        const tbody = document.getElementById('schedule-body');
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8" style="color: var(--text-secondary);">Loading...</td></tr>`;

        try {
            // TODO: Fetch from TheSportsDB API
            // For now, use sample data
            const sampleGames = getSampleGames(sport, year);
            games = sampleGames;
            
            // Load saved statuses from localStorage
            loadStatuses();
            
            renderGames(games);
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8" style="color: var(--danger);">Failed to load schedule</td></tr>`;
        }
    }

    function renderGames(gameList) {
        const tbody = document.getElementById('schedule-body');
        const filter = document.getElementById('team-filter').value.toLowerCase();
        
        // Filter by team
        const filtered = gameList.filter(game => {
            if (!filter) return true;
            return game.home.toLowerCase().includes(filter) || 
                   game.away.toLowerCase().includes(filter);
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8" style="color: var(--text-secondary);">No games found</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(game => {
            const status = gameStatuses[game.id] || 'wanted';
            const checked = status === 'wanted' ? 'checked' : '';
            const disabled = status === 'downloaded' ? 'disabled' : '';
            const statusHtml = getStatusHtml(status);
            
            return `
                <tr style="border-bottom: 1px solid var(--border-color);">
                    <td style="padding: 0.75rem 1rem;">
                        <input type="checkbox" class="game-checkbox" data-game-id="${game.id}" 
                               ${checked} ${disabled}>
                    </td>
                    <td style="padding: 0.75rem 1rem;">${game.date}</td>
                    <td style="padding: 0.75rem 1rem;">${game.time}</td>
                    <td style="padding: 0.75rem 1rem;">
                        <span class="font-medium">${game.home}</span>
                        <span style="color: var(--text-secondary);"> vs </span>
                        <span class="font-medium">${game.away}</span>
                    </td>
                    <td style="padding: 0.75rem 1rem;">${statusHtml}</td>
                </tr>
            `;
        }).join('');

        // Update select all
        updateSelectAllState();
    }

    function getStatusHtml(status) {
        const statusMap = {
            'wanted': `<span class="badge-wanted px-2 py-1 rounded text-xs">⏳ Wanted</span>`,
            'requested': `<span class="badge-requested px-2 py-1 rounded text-xs">⏳ Requested</span>`,
            'downloaded': `<span class="badge-downloaded px-2 py-1 rounded text-xs">✅ Downloaded</span>`
        };
        return statusMap[status] || statusMap['wanted'];
    }

    function toggleAllGames() {
        const checked = document.getElementById('select-all').checked;
        document.querySelectorAll('.game-checkbox:not(:disabled)').forEach(cb => {
            cb.checked = checked;
        });
    }

    function updateSelectAllState() {
        const checkboxes = document.querySelectorAll('.game-checkbox:not(:disabled)');
        const checked = document.querySelectorAll('.game-checkbox:checked:not(:disabled)');
        document.getElementById('select-all').checked = checkboxes.length > 0 && checkboxes.length === checked.length;
    }

    function filterGames() {
        renderGames(games);
    }

    // Save status to localStorage
    function saveStatuses() {
        localStorage.setItem('gametimarr_statuses', JSON.stringify(gameStatuses));
    }

    function loadStatuses() {
        const saved = localStorage.getItem('gametimarr_statuses');
        if (saved) {
            gameStatuses = JSON.parse(saved);
        }
    }

    // Search selected games
    async function searchSelected() {
        const selected = document.querySelectorAll('.game-checkbox:checked:not(:disabled)');
        
        if (selected.length === 0) {
            showToast('No games selected', 'warning');
            return;
        }

        const statusDiv = document.getElementById('search-status');
        const statusText = document.getElementById('search-status-text');
        statusDiv.classList.remove('hidden');
        statusText.textContent = `Searching ${selected.length} games...`;

        let found = 0;
        let failed = 0;

        for (const cb of selected) {
            const gameId = parseInt(cb.dataset.gameId);
            const game = games.find(g => g.id === gameId);
            
            if (!game) continue;

            try {
                statusText.textContent = `Searching: ${game.home} vs ${game.away}...`;
                
                // TODO: Actual search logic here
                // For now, simulate a search
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Simulate success
                gameStatuses[gameId] = 'requested';
                found++;
                cb.disabled = true;
                cb.checked = false;
                
            } catch (e) {
                failed++;
                showToast(`Failed: ${game.home} vs ${game.away}`, 'error');
            }
        }

        saveStatuses();
        renderGames(games);
        
        statusDiv.classList.add('hidden');
        showToast(`Searched: ${found} found, ${failed} failed`, found > 0 ? 'success' : 'warning');
    }

    // Sample data - will be replaced with real TheSportsDB data
    function getSampleGames(sport, year) {
        const samples = {
            'NCAAF': [
                { id: 1, date: '09/05/2026', time: '7:30 PM', home: 'Auburn', away: 'Baylor' },
                { id: 2, date: '09/05/2026', time: '3:30 PM', home: 'Alabama', away: 'Ohio State' },
                { id: 3, date: '09/12/2026', time: '8:00 PM', home: 'Texas', away: 'Oklahoma' },
                { id: 4, date: '09/12/2026', time: '12:00 PM', home: 'Clemson', away: 'Florida State' },
                { id: 5, date: '09/19/2026', time: '7:00 PM', home: 'Georgia', away: 'Tennessee' },
            ],
            'NFL': [
                { id: 101, date: '09/10/2026', time: '8:20 PM', home: 'Chiefs', away: 'Ravens' },
                { id: 102, date: '09/13/2026', time: '1:00 PM', home: 'Cowboys', away: 'Giants' },
                { id: 103, date: '09/13/2026', time: '4:25 PM', home: '49ers', away: 'Packers' },
            ],
            'MLB': [
                { id: 201, date: '09/05/2026', time: '7:05 PM', home: 'Yankees', away: 'Red Sox' },
                { id: 202, date: '09/06/2026', time: '4:10 PM', home: 'Dodgers', away: 'Padres' },
                { id: 203, date: '09/07/2026', time: '7:15 PM', home: 'Mets', away: 'Braves' },
            ]
        };
        return samples[sport] || [];
    }
</script>
{% endblock %}
